[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antyvirus"
version = "0.1.0"
description = "Wielowarstwowy silnik detekcji zagrożeń (sygnatury, YARA, heurystyka PE, entropia, skrypty)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "yara-python>=4.5.0",
    "pefile>=2023.2.7",
    "ppdeep>=2020.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "aiofiles>=23.2",
    "watchdog>=4.0",
    "psutil>=5.9",
    "py7zr>=1.0",
]

[project.optional-dependencies]
extra = ["psutil>=5.9", "py-tlsh>=4.7"]

[project.scripts]
avy = "avengine.cli:main"

[tool.setuptools.packages.find]
include = ["avengine*"]

[tool.setuptools.package-data]
avengine = ["web/static/*"]
